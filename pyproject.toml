[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "calibration-aware-grpo"
version = "0.3.2"
description = "Calibration-aware grouped policy optimization for JAX and Tunix"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = [
  "numpy>=1.26",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.optional-dependencies]
jax = [
  "jax>=0.8,<0.9",
]
tunix = [
  "flax==0.11.1",
  "google-tunix @ git+https://github.com/google/tunix@5318eca862f478f77b8a0d3f295a26acb849ae85",
  "jax==0.8.1",
]
dev = [
  "build>=1.2",
  "jax>=0.8,<0.9",
  "mypy>=1.15",
  "pytest>=8",
  "ruff>=0.11",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
